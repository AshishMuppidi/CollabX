server:
  port: ${PORT:8080}

spring:
  application:
    name: collabx-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/collabx_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

collabx:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  judge0:
    api-url: ${JUDGE0_API_URL:https://ce.judge0.com}
    api-key: ${JUDGE0_API_KEY:}
    api-host: ${JUDGE0_API_HOST:}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:1000}
    max-poll-attempts: ${JUDGE0_MAX_POLL_ATTEMPTS:25}
    fetch-timeout-ms: ${JUDGE0_FETCH_TIMEOUT_MS:15000}

logging:
  level:
    root: INFO
    com.collabx: DEBUG
